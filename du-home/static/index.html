<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
  <title>渡の家</title>
</head>
<body>

  <div class="header">岁月津渡</div>

  <div class="tabs">
    <button class="tab active" data-page="chat">聊天</button>
    <button class="tab" data-page="music">音乐</button>
  </div>

  <!-- 聊天页 -->
  <div id="chat" class="page active">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-bar">
      <textarea id="chatInput" rows="1" placeholder="说点什么..."></textarea>
      <button id="sendBtn">↑</button>
    </div>
  </div>

  <!-- 音乐页 -->
  <div id="music" class="page">
    <div class="music-page">
      <div class="music-search-bar">
        <input id="musicSearch" placeholder="搜索歌曲...">
        <button id="musicSearchBtn">搜索</button>
      </div>
      <ul class="song-list" id="songList"></ul>
    </div>
    <div class="player-bar" id="playerBar">
      <button class="player-btn" id="prevBtn">⏮</button>
      <button class="player-btn" id="playBtn">▶</button>
      <button class="player-btn" id="nextBtn">⏭</button>
      <div class="player-info">
        <div class="name" id="playerName">-</div>
        <div class="artist" id="playerArtist">-</div>
      </div>
    </div>
  </div>

  <audio id="audioEl"></audio>
  <script src="/static/app.js"></script>
</body>
</html>
